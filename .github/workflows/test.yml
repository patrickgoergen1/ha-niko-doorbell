name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Home Assistant + test dependencies
        run: |
          pip install homeassistant
          pip install -r requirements_test.txt
      - name: Run tests
        run: pytest tests/
